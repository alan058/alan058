name: Build Windows app

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # run.bat must install psutil from the bundled wheels and open the window.
      - name: run.bat starts the app offline
        shell: pwsh
        run: |
          cmd /c run.bat
          if ($LASTEXITCODE -ne 0) { throw "run.bat failed" }
          Start-Sleep -Seconds 10
          $p = Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like '*ProcWatch.pyw*' }
          if (-not $p) { throw "ProcWatch did not start" }
          $p | ForEach-Object { Stop-Process -Id $_.ProcessId -Force }
      - run: python -m pip install --no-index --find-links wheels psutil
      - run: python -m pip install pytest
      - run: python -m pytest -v tests

  nest-laptop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r NestLaptop/requirements.txt pytest
      - run: python -m pytest -v NestLaptop/tests

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Same offline install as build_exe.bat: bundled wheels only, no PyPI.
      - run: python -m pip install --no-index --find-links wheels --find-links wheels/build psutil pyinstaller
      - run: python -m PyInstaller --noconfirm --onefile --windowed --name ProcWatch ProcWatch.pyw
      - name: Assemble the portable folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory ProcWatch | Out-Null
          Copy-Item dist/ProcWatch.exe, ProcWatch.pyw, run.bat, build_exe.bat, HOW-TO-RUN.txt, README.md, requirements.txt ProcWatch/
          Copy-Item -Recurse procwatch, wheels ProcWatch/
      - uses: actions/upload-artifact@v4
        with:
          name: ProcWatch-windows
          path: ProcWatch/
