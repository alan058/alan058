# Full stack for local development: SQL Server 2022 + database deployment + web app.
#   docker compose up --build
# then open http://localhost:8080
#
# The password below is for a throw-away local container only.
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "StockFlow!Dev123"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-C", "-S", "localhost", "-U", "sa", "-P", "StockFlow!Dev123", "-Q", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  dbdeploy:
    build: .
    entrypoint: ["dotnet", "dbdeploy/stockflow-dbdeploy.dll", "--seed-demo"]
    environment:
      STOCKFLOW_DB: "Server=sql;Database=StockFlow;User Id=sa;Password=StockFlow!Dev123;TrustServerCertificate=True"
    depends_on:
      sql:
        condition: service_healthy

  web:
    build: .
    ports:
      - "8080:8080"
    environment:
      StockFlow__Data__Provider: "SqlServer"
      StockFlow__Data__ConnectionString: "Server=sql;Database=StockFlow;User Id=sa;Password=StockFlow!Dev123;TrustServerCertificate=True"
    depends_on:
      dbdeploy:
        condition: service_completed_successfully
